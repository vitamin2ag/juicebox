title: 'Globals – JSON-LD'
sections:
  -
    display: 'Organization / Person'
    instructions: 'Basic information about the organization or person this website represents.'
    fields:
      -
        handle: json_ld_entity
        field:
          dictionary:
            type: schemas
            category: Globals
          max_items: 1
          type: dictionary
          display: 'Schema Type'
          instructions: 'Sets which structured data type (organization, person, local business, corporation) is output site-wide. (`@type`)'
          instructions_position: below
      -
        handle: json_ld_entity_name
        field:
          type: text
          display: Name
          instructions: 'Leave empty to use the site name. (`name`)'
          instructions_position: below
          width: 50
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_alternate_name
        field:
          type: text
          display: 'Alternate Name'
          instructions: 'A second name or short form the organization is also known by. (`alternateName`)'
          instructions_position: below
          width: 50
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_legal_name
        field:
          type: text
          display: 'Legal Name'
          instructions: 'If different from the brand name. (`legalName`)'
          instructions_position: below
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_description
        field:
          type: textarea
          display: Description
          instructions: 'A short description of the organization for search engines. (`description`)'
          instructions_position: below
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_email
        field:
          type: text
          display: Email
          instructions: 'General contact email address. (`email`)'
          instructions_position: below
          width: 50
          if:
            json_ld_entity: 'not empty'
          validate:
            - email
      -
        handle: json_ld_entity_telephone
        field:
          type: text
          display: Telephone
          instructions: 'General contact phone number. (`telephone`)'
          instructions_position: below
          width: 50
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_address_street
        field:
          type: text
          display: Street
          instructions: 'Street and house number. (`streetAddress`)'
          instructions_position: below
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_address_zip
        field:
          type: text
          display: 'Postal Code'
          instructions: 'Postal code. (`postalCode`)'
          instructions_position: below
          width: 50
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_address_city
        field:
          type: text
          display: Locality
          instructions: 'Town or city. (`addressLocality`)'
          instructions_position: below
          width: 50
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_address_region
        field:
          type: text
          display: 'State / Region'
          instructions: 'State, canton or region. (`addressRegion`)'
          instructions_position: below
          width: 50
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_address_country
        field:
          type: text
          display: Country
          width: 50
          instructions: '[ISO 3166 country code](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2) (`addressCountry`)'
          instructions_position: below
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_latitude
        field:
          type: text
          display: Latitude
          width: 50
          instructions: 'Find coordinates on [latlong.net](https://www.latlong.net/) (`latitude`)'
          instructions_position: below
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_longitude
        field:
          type: text
          display: Longitude
          instructions: 'Find coordinates on [latlong.net](https://www.latlong.net/) (`longitude`)'
          instructions_position: below
          width: 50
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_same_as
        field:
          type: list
          display: 'Same As'
          instructions: 'Social media profiles or other URLs that represent this organization. (`sameAs`)'
          add_row: 'Add URL'
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_logo
        field:
          type: assets
          container: assets
          max_files: 1
          display: Logo
          instructions: 'Output as the logo or image in the structured data. (`logo` / `image`)'
          instructions_position: below
          validate:
            - image
          if:
            json_ld_entity: 'not empty'
          width: 50
      -
        handle: json_ld_entity_url
        field:
          type: text
          input_type: url
          display: URL
          instructions: 'Leave empty to use the site URL. (`url`)'
          instructions_position: below
          width: 50
          validate:
            - url
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_founding_date
        field:
          type: date
          display: 'Founding Date'
          instructions: 'The date the company was founded. (`foundingDate`)'
          instructions_position: below
          width: 50
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_vat_id
        field:
          type: text
          display: 'VAT Number'
          width: 50
          instructions: 'VAT identification number, e.g. CHE-123.456.789 MWST. (`vatID`)'
          instructions_position: below
          if:
            json_ld_entity: 'not empty'
      -
        handle: json_ld_entity_price_range
        field:
          type: select
          display: 'Price Range'
          instructions: 'The relative price range of the business, e.g. $$ for mid-range. (`priceRange`)'
          instructions_position: below
          clearable: true
          options:
            $: $
            $$: $$
            $$$: $$$
            $$$$: $$$$
          if:
            json_ld_entity: 'equals LocalBusiness'
      -
        handle: json_ld_entity_ticker_symbol
        field:
          type: text
          display: 'Ticker Symbol'
          instructions: 'The stock ticker symbol of the corporation, e.g. AAPL. (`tickerSymbol`)'
          instructions_position: below
          if:
            json_ld_entity: 'equals Corporation'
      -
        handle: json_ld_entity_opening_hours
        field:
          type: grid
          display: 'Opening Hours'
          instructions: 'Opening hours per weekday. Leave out a day when closed. (`openingHoursSpecification`)'
          instructions_position: below
          max_rows: 7
          if:
            json_ld_entity: 'equals LocalBusiness'
          fields:
            -
              handle: day
              field:
                type: select
                display: Day
                instructions: 'Day of the week. (`dayOfWeek`)'
                width: 34
                options:
                  monday: Monday
                  tuesday: Tuesday
                  wednesday: Wednesday
                  thursday: Thursday
                  friday: Friday
                  saturday: Saturday
                  sunday: Sunday
                validate:
                  - required
            -
              handle: opening
              field:
                type: time
                display: Opens
                instructions: 'Opening time. (`opens`)'
                width: 33
            -
              handle: closing
              field:
                type: time
                display: Closes
                instructions: 'Closing time. (`closes`)'
                width: 33
  -
    display: Website
    instructions: 'Details about the website as a whole, independent of the organization or person.'
    fields:
      -
        handle: json_ld_website_name
        field:
          type: text
          display: Name
          instructions: 'Leave empty to use the site name. (`name`)'
          instructions_position: below
          width: 50
      -
        handle: json_ld_website_alternate_name
        field:
          type: text
          display: 'Alternate Name'
          instructions: 'A second name or short form of the website. (`alternateName`)'
          instructions_position: below
          width: 50
      -
        handle: json_ld_website_description
        field:
          type: textarea
          display: Description
          instructions: 'A short description of the website for search engines. (`description`)'
          instructions_position: below
      -
        handle: json_ld_website_search_url
        field:
          type: text
          display: 'Search URL'
          instructions: 'Leave empty if the site has no search. A full URL or a path from the site root (starting with `/`). `{search_term_string}` stands for the search term. (`potentialAction`)'
          instructions_position: below
          validate:
            - 'regex:/^(https?:\/\/|\/)\S*\{search_term_string\}\S*$/'
