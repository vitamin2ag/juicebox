name: quality

# Coverage, mutation, browser and asset checks only run when code or its tooling changes;
# tests.yml runs the fast gate, which also checks the docs, on every change.
on:
  push:
    branches:
      - main
    paths: &paths
      - src/**
      - features/**
      - tests/**
      - workbench/**
      - scripts/**
      - types/**
      - composer.json
      - phpunit.xml.dist
      - testbench.yaml
      - package.json
      - package-lock.json
      - tsconfig.json
      - .nvmrc
      - .npmrc
      - .oxlintrc.json
      - .prettierrc.json
      - .github/workflows/quality.yml
  pull_request:
    paths: *paths
  # Run by hand on main before a release, since dependencies move without a lock file.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    name: Code Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL, pcov.directory=.
          tools: composer:v2
          coverage: pcov

      - &composer-cache-dir
        name: Find the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      # A key per run, as there is no lock file: each run saves the versions it downloaded.
      - &composer-cache
        name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ github.run_id }}
          restore-keys: composer-

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Code Coverage
        run: composer test:coverage

  mutation-paths:
    runs-on: ubuntu-latest
    name: Mutation Paths
    outputs:
      paths: ${{ steps.paths.outputs.paths }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One mutation job per source folder, so a new feature gets its own job.
      - name: List the source folders
        id: paths
        run: echo "paths=$(ls -d src features/*/src | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  mutation:
    needs: mutation-paths
    runs-on: ubuntu-latest
    name: Mutation Testing (${{ matrix.path }})
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.mutation-paths.outputs.paths) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL, pcov.directory=.
          tools: composer:v2
          coverage: pcov

      - *composer-cache-dir

      - *composer-cache

      - name: Install dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Mutation Testing
        run: composer test:mutate -- --path=${{ matrix.path }} --ignore-min-score-on-zero-mutations

  browser:
    runs-on: ubuntu-latest
    name: Browser Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - *composer-cache-dir

      - *composer-cache

      - name: Install Composer dependencies
        run: |
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-scripts
          composer run prepare

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Without --with-deps: the runner image already has the libraries Chromium needs, and apt
      # downloads from the Ubuntu archive hang on the runner now and then.
      - name: Install Chromium
        run: npx playwright install chromium

      - name: Browser Tests
        run: composer test:browser

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots

  assets:
    runs-on: ubuntu-latest
    name: Control Panel Assets

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, sqlite, pdo_sqlite, bcmath, intl
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer update --prefer-stable --prefer-dist --no-dev --no-interaction --no-progress --no-scripts

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Committed assets are up to date
        run: test -z "$(git status --porcelain -- 'features/*/resources/dist/*')"
