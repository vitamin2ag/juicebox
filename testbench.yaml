laravel: '@testbench'

providers:
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Vitamin2\Juicebox\ServiceProvider

env:
  # Statamic's CheckComposerJsonScripts middleware inspects the skeleton's composer.json
  # unless the app is in the testing environment.
  - APP_ENV=testing
  - APP_NAME="Juicebox Workbench"
  - APP_DEBUG=true
  - CACHE_STORE=file
  - SESSION_DRIVER=file
  # The workbench database is an empty in-memory SQLite without a jobs table, so Statamic's
  # queued listeners (e.g. the search index update on saving an entry) run right away.
  - QUEUE_CONNECTION=sync

workbench:
  start: '/'
  install: false
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: false
    views: true
  build:
    - asset-publish
  assets:
    - statamic-cp
    - redirects
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
